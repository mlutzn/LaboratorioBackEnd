services:
  db:
    build: .
    container_name: postgres-lab
    restart: always
    environment:
      POSTGRES_USER: laboratorio
      POSTGRES_PASSWORD: laboratorio
      POSTGRES_DB: laboratoriodb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: keycloak
    # start.sh ejecuta "kc.sh start-dev --import-realm":
    #   start-dev: modo desarrollo (HTTP, sin cache de temas, BD embebida)
    #   --import-realm: importa los realms en /opt/keycloak/data/import al arrancar
    # y además permite HTTP en el realm master para poder entrar a la consola.
    entrypoint: ["/bin/bash", "/opt/keycloak/start.sh"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-laboratoriobackend.json:/opt/keycloak/data/import/realm-laboratoriobackend.json:ro
      - ./keycloak/start.sh:/opt/keycloak/start.sh:ro
volumes:
  pgdata:


